name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the android/ platform folder around the committed lib/ + pubspec
      - name: Create Android platform scaffolding
        working-directory: flutter_app
        run: flutter create . --platforms android --org com.hatchery --project-name doc_tracker

      # Release builds do NOT get INTERNET permission automatically (debug does)
      - name: Add INTERNET permission to AndroidManifest
        working-directory: flutter_app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          grep -n 'INTERNET' "$MANIFEST"

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk doc-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: doc-tracker-apk
          path: doc-tracker.apk

      # Publish/refresh a fixed release so the APK has a stable download URL
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'DOC Tracker — Android APK (latest)'
          body: |
            📱 ดาวน์โหลดไฟล์ doc-tracker.apk ด้านล่างเพื่อติดตั้งบน Android
            (Build จาก commit ${{ github.sha }})
          files: doc-tracker.apk
          make_latest: true
