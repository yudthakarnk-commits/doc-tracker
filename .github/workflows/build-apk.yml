name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fixed signing key so every APK is signed identically — users can
      # install updates over the old version instead of uninstalling.
      # (Flutter's release template signs with the debug keystore; we pin it.)
      - name: Ensure fixed signing keystore
        run: |
          mkdir -p ~/.android
          if [ -f signing/debug.keystore ]; then
            cp signing/debug.keystore ~/.android/debug.keystore
            echo "Using committed keystore"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=DOC Tracker, OU=Hatchery, O=PS, C=MY"
            mkdir -p signing
            cp ~/.android/debug.keystore signing/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add signing/debug.keystore
            git commit -m "chore: pin APK signing keystore [skip ci]"
            git push
            echo "Generated and committed new keystore"
          fi

      # Generate the android/ platform folder around the committed lib/ + pubspec
      - name: Create Android platform scaffolding
        working-directory: flutter_app
        run: flutter create . --platforms android --org com.hatchery --project-name doc_tracker

      # Release builds do NOT get INTERNET permission automatically (debug does)
      - name: Add INTERNET permission to AndroidManifest
        working-directory: flutter_app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          grep -n 'INTERNET' "$MANIFEST"

      # Explicit release signing — the ~/.android/debug.keystore trick failed
      # (AGP generated its own key per build, so signatures never matched and
      # Android rejected every update as a package conflict).
      - name: Configure explicit release signing
        working-directory: flutter_app
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            G=android/app/build.gradle.kts
            sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfigs.getByName("release")|' "$G"
            sed -i 's|buildTypes {|signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("SIGNING_KEYSTORE") ?: "keystore-missing")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n    buildTypes {|' "$G"
          else
            G=android/app/build.gradle
            sed -i 's|signingConfig signingConfigs.debug|signingConfig signingConfigs.release|' "$G"
            sed -i 's|buildTypes {|signingConfigs {\n        release {\n            storeFile file(System.getenv("SIGNING_KEYSTORE"))\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n    buildTypes {|' "$G"
          fi
          echo "--- patched $G ---"
          grep -n -B1 -A8 'signingConfigs' "$G" | head -30

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons

      - name: Build release APK
        working-directory: flutter_app
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/signing/debug.keystore
        run: flutter build apk --release

      # Hard gate: fail the build if the APK is not signed with the pinned key
      - name: Verify APK signature matches pinned certificate
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            flutter_app/build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "72bb6d435ac286880c42465df9ce7fe250e05bffe75e447dc9cde1cfe20f237d" certs.txt \
            || { echo "::error::APK signed with WRONG certificate — refusing to release"; exit 1; }

      - name: Rename APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk doc-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: doc-tracker-apk
          path: doc-tracker.apk

      # Publish/refresh a fixed release so the APK has a stable download URL
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'DOC Tracker — Android APK (latest)'
          body: |
            📱 ดาวน์โหลดไฟล์ doc-tracker.apk ด้านล่างเพื่อติดตั้งบน Android
            (Build จาก commit ${{ github.sha }})
          files: doc-tracker.apk
          make_latest: true
