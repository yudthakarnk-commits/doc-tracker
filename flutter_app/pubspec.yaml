name: doc_tracker
description: DOC Tracker — Hatchery Management mobile app
publish_to: 'none'
version: 1.2.9+14

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  fl_chart: ^0.69.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sarabun-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
